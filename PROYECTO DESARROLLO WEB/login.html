<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Inicio de sesión - Sistema de Préstamo de Equipo de Laboratorio.">
    <title>Login | Sistema Alquiler</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- CONTENIDO PRINCIPAL -------------------------------------------------------------------------------------------------------------------------- -->
    <main class="login-wrap">

        <!-- PANEL DE MARCA -->
        <section class="brand-panel">
            <p class="brand-eyebrow">Sistema Control de inventario de laboratorio</p>
            <h1>Sistema de préstamo de equipo</h1>
            <p class="brand-desc">
                Registro, disponibilidad y devolución de equipo de laboratorio.
                
            </p>
            
        </section>

        <!-- PANEL DEL FORMULARIO -->
        <section class="form-panel">
            <div class="login-card">
                <h2>Iniciar sesión</h2>
                <p class="sub">Ingresa tu usuario y contraseña para poder acceder al sistema.</p>

                <form id="login-form">
                    <div class="field">
                        <label for="usuario">Usuario</label>
                        <input type="text" id="usuario" name="usuario" autocomplete="username" required>
                    </div>

                    <div class="field">
                        <label for="contrasena">Contraseña</label>
                        <input type="password" id="contrasena" name="contrasena" autocomplete="current-password" required>
                    </div>

                    <div class="field-row">
                     
                        <a href="#">¿Olvidaste tu contraseña?</a>
                    </div>

                    <button type="submit" class="btn btn-principal">Iniciar sesión</button>

                    <p class="status-msg" id="status-msg"></p>
                </form>
            </div>
        </section>

    </main>

    <!-- ENVÍO DEL FORMULARIO -->
    <script>
        const form = document.getElementById('login-form');
        const statusMsg = document.getElementById('status-msg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            statusMsg.classList.remove('visible');

            const usuario = document.getElementById('usuario').value.trim();
            const contrasena = document.getElementById('contrasena').value;

            if (!usuario || !contrasena) {
                statusMsg.textContent = 'Ingresa usuario y contraseña.';
                statusMsg.classList.add('visible');
                return;
            }

            try {
                const res = await fetch('api_login.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, contrasena })
                });
                const data = await res.json();

                if (data.success) {
                    window.location.href = 'dashboard.html';
                } else {
                    statusMsg.textContent = data.error || 'Usuario o contraseña incorrectos.';
                    statusMsg.classList.add('visible');
                }
            } catch (err) {
                statusMsg.textContent = 'No se pudo conectar con el servidor.';
                statusMsg.classList.add('visible');
            }
        });
    </script>

</body>
</html>
