<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel principal | Sistema Alquiler</title>

    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f4f0;
            color: #16211f;
        }

        /* Menu  */
        .navbar {
            background-color: #101a19;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar .marca {
            color: #ffffff;
            font-weight: bold;
            font-size: 18px;
        }

        .navbar ul {
            list-style: none;
            display: flex;
            gap: 20px;
        }

        .navbar ul li a {
            color: #cdd6d3;
            text-decoration: none;
            font-size: 14px;
        }

        .navbar ul li a:hover {
            color: #ffffff;
        }

        /* Contenido */
        .contenido {
            max-width: 1000px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .contenido h1 {
            margin-bottom: 20px;
        }

        /* modulos */
        .modulos {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .modulo-card {
            background-color: #ffffff;
            border: 1px solid #d8dcd3;
            border-radius: 6px;
            padding: 20px;
            text-decoration: none;
            color: #16211f;
        }

        .modulo-card:hover {
            border-color: #2f8f80;
        }
    </style>
</head>
<body>

    <!-menu superiror>
    <header class="navbar">
        <span class="marca">Sistema de Préstamo</span>

        <nav>
            <ul>
                <li><a href="dashboard.html">Panel principal</a></li>
                <li><a href="clientes.html">Clientes</a></li>
                <li><a href="empleados.html">Empleados</a></li>
                <li><a href="categorias.html">Categorías</a></li>
                <li><a href="equipos.html">Equipos</a></li>
                <li><a href="alquileres.html">Alquileres</a></li>
                <li><a href="login.html">Cerrar sesión</a></li>
            </ul>
        </nav>
    </header>

    <!-- CONTENIDO -->
    <main class="contenido">
        <h1>Panel principal</h1>

        <section class="modulos">
            <a href="clientes.html" class="modulo-card">Clientes</a>
            <a href="empleados.html" class="modulo-card">Empleados</a>
            <a href="categorias.html" class="modulo-card">Categorías</a>
            <a href="equipos.html" class="modulo-card">Equipos</a>
            <a href="alquileres.html" class="modulo-card">Alquileres</a>
            <a href="usuarios.html" class="modulo-card">Usuarios</a>
        </section>
    </main>

</body>
</html>
